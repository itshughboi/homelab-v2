[all:vars]
ansible_user=hughboi
ansible_become=yes
ansible_become_method=sudo
ansible_ssh_private_key_file=~/.ssh/homelab-athena_id_ed25519

# ═══════════════════════════════════════════════════════════════════
# SINGLE SOURCE OF TRUTH for all Ansible inventory.
# Every playbook + Semaphore template points here. Do NOT re-create
# per-playbook inventory.yaml files — add hosts/groups to this file.
#
# Playbooks target various group NAMES (docker_hosts, proxmox, k3s_servers,
# etc.). Those are defined below, many as :children aliases onto the real
# host groups, so a playbook's `hosts:` line always resolves. If you add a
# playbook that targets a new group name, add that group here.
# ═══════════════════════════════════════════════════════════════════

# ─── Proxmox Nodes ────────────────────────────────────────────────
# Root-only over SSH — no unprivileged user, no sudo binary. Overrides [all:vars].
# Per-node network-setup vars (NIC/bridge/storage-VLAN, which differ srv-1 vs
# 2/3/4) live in host_vars/pve-srv-*.yml.
# NOTE on cluster-update ordering: that playbook updates nodes in the order
# listed and halts on failure — least-critical first. It historically used its
# own inventory ordered pve-srv-4,3,2,1 (srv-1 = primary, updated LAST). If
# running cluster-update off this shared inventory, pass a Limit/serial or an
# explicit order so srv-1 stays last.
[pve]
pve-srv-1 ansible_host=10.10.10.1
pve-srv-2 ansible_host=10.10.10.2
pve-srv-3 ansible_host=10.10.10.3
pve-srv-4 ansible_host=10.10.10.4

[pve:vars]
ansible_user=root
ansible_become=no

# ─── Management Plane ─────────────────────────────────────────────
# Athena runs Semaphore (as a container). Semaphore SSHes OUT to this host to
# manage it — reached like any SSH target, NOT ansible_connection=local (local
# = inside the container, which has no host docker/sudo). The homelab-athena
# key must be in this host's hughboi authorized_keys.
[athena]
athena ansible_host=10.10.10.8

# ─── PBS (Proxmox Backup Server) ──────────────────────────────────
[pbs]
pbs ansible_host=10.10.10.6

# ─── Tailscale Gateway ─────────────────────────────────────────────
[tailscale_gateway]
tailscale-gateway ansible_host=10.10.80.10

# ─── Netboot ───────────────────────────────────────────────────────
[netboot]
libre-potato ansible_host=10.10.99.99

# ─── UniFi (API, not SSH) ─────────────────────────────────────────
# The unifi playbook talks to the controller API, not SSH — set local connection
# when you wire it up. (Was aspirational; folded here so the detail isn't lost.)
# [unifi]
# unifi-controller ansible_connection=local

# ─── Docker Hosts ─────────────────────────────────────────────────
# dock-prod runs most services; athena runs the management-plane containers
# (gitea, bind9). Playbooks that should hit only ONE of them (image-prune,
# postgres-maintenance, volume-backup, image-audit, image-update, compose-health,
# and sops-deploy/compose-control which are per-service) MUST set the Semaphore
# template's Limit field (-l dock-prod or -l athena). sops-deploy and
# compose-control additionally fail-fast if a run isn't limited to one host.
[docker]
dock-prod ansible_host=10.10.10.10
athena ansible_host=10.10.10.8

[docker_host]
dock-prod ansible_host=10.10.10.10

[vaultwarden_host]
dock-prod ansible_host=10.10.10.10

# ─── k3s Cluster ─────────────────────────────────────────────────
[masters]
k3s-master-1 ansible_host=10.10.30.1
k3s-master-2 ansible_host=10.10.30.2
k3s-master-3 ansible_host=10.10.30.3

[workers]
k3s-worker-1 ansible_host=10.10.30.11
k3s-worker-2 ansible_host=10.10.30.12
k3s-worker-3 ansible_host=10.10.30.13

[longhorn]
k3s-longhorn-1 ansible_host=10.10.30.51
k3s-longhorn-2 ansible_host=10.10.30.52
k3s-longhorn-3 ansible_host=10.10.30.53

[k3s:children]
masters
workers
longhorn

# ─── Placeholder groups ───────────────────────────────────────────
# new-host-bootstrap targets this; populate temporarily when onboarding a host.
[new_hosts]

# ═══════════════════════════════════════════════════════════════════
# ALIAS GROUPS — map the group NAMES playbooks target onto the real
# host groups above. This is what lets every playbook share this one
# inventory. (Ansible :children groups are aliases/supersets.)
# ═══════════════════════════════════════════════════════════════════

# proxmox / proxmox_primary: cluster-update, snapshot-*, storage-report, vm-inventory
[proxmox:children]
pve

[proxmox_primary]
pve-srv-1 ansible_host=10.10.10.1

# k3s_servers / k3s_workers / k3s_primary: k3s-upgrade, etcd-backup, resource-audit
[k3s_servers:children]
masters

[k3s_workers:children]
workers

[k3s_primary]
k3s-master-1 ansible_host=10.10.30.1

# backup_control: backup-verify (runs on Athena)
[backup_control:children]
athena

# iperf server/clients: network bandwidth tests
[iperf_server]
dock-prod ansible_host=10.10.10.10

[iperf_clients:children]
athena
masters

# ─── Broad OS groupings ───────────────────────────────────────────
[ubuntu:children]
athena
docker
masters
workers
longhorn
pbs

[all_k8s:children]
masters
workers
longhorn
