---
# Full-fleet disk-usage snapshot. Every host with a real filesystem to watch:
# the 4 Proxmox nodes, the two management/docker VMs, and the 9 k3s VMs.
#
# Proxmox hosts are root-only over SSH (no hughboi user, no sudo binary) — set
# ansible_user: root + ansible_become: false per host. VMs use the normal hughboi
# + sudo path. Athena is reached over SSH like any host (Semaphore SSHes out to
# the Athena host; see ../../docker/compose-control/README.md for why).

all:
  vars:
    ansible_user: hughboi
    ansible_ssh_private_key_file: ~/.ssh/homelab-athena_id_ed25519

  hosts:
    # ─── Proxmox nodes (root-only, no sudo) ───
    pve-srv-1:
      ansible_host: 10.10.10.1
      ansible_user: root
      ansible_become: false
    pve-srv-2:
      ansible_host: 10.10.10.2
      ansible_user: root
      ansible_become: false
    pve-srv-3:
      ansible_host: 10.10.10.3
      ansible_user: root
      ansible_become: false
    pve-srv-4:
      ansible_host: 10.10.10.4
      ansible_user: root
      ansible_become: false

    # ─── Management / Docker VMs ───
    athena:
      ansible_host: 10.10.10.8
    dock-prod:
      ansible_host: 10.10.10.10

    # ─── k3s cluster VMs ───
    k3s-master-1:
      ansible_host: 10.10.30.1
    k3s-master-2:
      ansible_host: 10.10.30.2
    k3s-master-3:
      ansible_host: 10.10.30.3
    k3s-worker-1:
      ansible_host: 10.10.30.11
    k3s-worker-2:
      ansible_host: 10.10.30.12
    k3s-worker-3:
      ansible_host: 10.10.30.13
    k3s-longhorn-1:
      ansible_host: 10.10.30.51
    k3s-longhorn-2:
      ansible_host: 10.10.30.52
    k3s-longhorn-3:
      ansible_host: 10.10.30.53
