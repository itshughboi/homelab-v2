---
# Intel GPU (Arc A380) Prometheus exporter — home-built (see Dockerfile/exporter.py).
# Exposes intel_gpu_top engine utilization / frequency / rc6 on :8080 for the
# `intel_gpu` Prometheus job in the promgraftail stack.
#
# Needs broad access to read GPU counters: privileged + /dev/dri + host PID. This
# is why it's a small auditable build rather than a random prebuilt image.

services:
  intel-gpu-exporter:
    container_name: intel-gpu-exporter
    build:
      context: .
      dockerfile: Dockerfile
    image: homelab/intel-gpu-exporter:local
    restart: unless-stopped
    privileged: true          # required for intel_gpu_top to read perf counters
    pid: host                 # so it sees GPU clients across the host
    devices:
      - /dev/dri:/dev/dri
    networks:
      - promgraftail

networks:
  promgraftail:
    external: true
