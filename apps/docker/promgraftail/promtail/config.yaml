---
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: https://loki.hughboi.cc/loki/api/v1/push
    batchsize: 512000 # 500 KB per batch instead of 1 MB. Performance decision
    batchwait: 2s # wait 2 seconds before sending batch. Performance decision


scrape_configs:
  - job_name: dock-prod_system
    static_configs:
      - targets:
          - 10.10.10.10
        labels:
          job: dock-prod_varlogs
          __path__: /var/log/*log

  - job_name: pve-srv-1_system
    static_configs:
      - targets:
          - 10.10.10.1
        labels:
          job: pve-srv-1_varlogs
          __path__: /var/log/*log

  - job_name: pve-srv-2_system
    static_configs:
      - targets:
          - 10.10.10.2
        labels:
          job: pve-srv-2_varlogs
          __path__: /var/log/*log

  - job_name: pve-srv-3_system
    static_configs:
      - targets:
          - 10.10.10.3
        labels:
          job: pve-srv-3_varlogs
          __path__: /var/log/*log

  - job_name: pve-srv-4_system
    static_configs:
      - targets:
          - 10.10.10.4
        labels:
          job: pve-srv-4_varlogs
          __path__: /var/log/*log

  # NOTE: unbound_logs job removed during the promgraftail migration.
  # Unbound log shipping will be re-added properly alongside the AdGuard/unbound
  # observability work (unbound currently logs to a file inside its own container;
  # needs to be pointed at a shared path or switched to stdout first).

  - job_name: bind9
    syslog:
      listen_address: 0.0.0.0:1514
      idle_timeout: 60s
      label_structured_data: yes
      labels:
        job: bind9

  # AdGuard query log — per-query client IP -> domain, blocked/allowed, upstream.
  # This is the "who visited what" data the AdGuard UI shows, shipped to Loki.
  # File is JSON-lines at /adguard-querylog/querylog.json (mounted from
  # /home/hughboi/data/adguard/work/data). Rotates to querylog.json.1 after
  # ~30d (interval 720h), so glob the active file.
  - job_name: adguard-queries
    static_configs:
      - targets:
          - localhost
        labels:
          job: adguard-queries
          host: dock-prod
          __path__: /adguard-querylog/querylog.json
    pipeline_stages:
      # Parse the JSON line into extracted fields.
      - json:
          expressions:
            timestamp: T
            query: QH
            qtype: QT
            client: IP
            upstream: Upstream
            cached: Cached
            elapsed: Elapsed
            is_filtered: Result.IsFiltered
            filter_reason: Result.Reason
      # Use AdGuard's own timestamp (RFC3339 with nanoseconds + offset).
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      # Derive a clean blocked=true/false template value from Result.IsFiltered
      # (absent/empty when the query was allowed).
      - template:
          source: blocked
          template: '{{ if eq .is_filtered "true" }}true{{ else }}false{{ end }}'
      # Low-cardinality labels only: client IP, blocked status, query type.
      # Domain (query) is intentionally NOT a label — it would explode cardinality;
      # it stays queryable via the JSON line body / LogQL json parser in Grafana.
      - labels:
          client:
          blocked:
          qtype:
      # No output stage: the original raw JSON line is preserved as the log body,
      # so Grafana can parse it with `| json` (query, upstream, elapsed, etc.).
