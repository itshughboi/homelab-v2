---
# MERGED compose for review — promgraftail migrated into homelab repo.
# Principles applied:
#   - Config files: relative ./ paths (this file lives in the repo dir), NOT
#     the old /home/hughboi/promgraftail or the bogus /home/hughboi/code paths.
#   - Data: /home/hughboi/data/<component> (moved via mv, same filesystem).
#   - Images: latest stable pins verified today. Loki -> 3.7.6 too, since we are
#     WIPING the old 19G of Loki logs (user OK'd; they regenerate) and starting
#     fresh, so there is no schema-jump risk. Only Grafana + InfluxDB data moves.
#   - user:/ports: keep LIVE proven values (grafana user "0"; live port exposure).
#   - Keep repo's good hardening: loki logging driver blocks, memory limits.
#   - Networks: preserve what live uses (promgraftail + proxy; promtail external
#     for the :1514 bind9 syslog path; unbound external where relevant).
#   - FIX the broken unbound.log mount -> new /home/hughboi/data/adguard path.
#   - TODO(gitea issue): localhost-bind published ports for hardening.

services:

  grafana:
    container_name: grafana
    image: grafana/grafana:13.1.3          # was :main  (verified latest stable)
    restart: unless-stopped
    # Live runs user "0": the comment on the old stack notes 472 hit a write-perm
    # issue. Keeping "0" (proven). Revisit with the hardening issue.
    user: "0"
    security_opt:
      - no-new-privileges:true
      - apparmor:unconfined
    logging:
      driver: loki
      options:
        loki-url: "https://loki.hughboi.cc/loki/api/v1/push"
        loki-retries: 2
        loki-max-backoff: 800ms
        loki-timeout: 1s
        keep-file: "true"
        mode: "non-blocking"
    environment:
      - GF_ANALYTICS_REPORTING_ENABLED=false
      # For ${INFLUX_TOKEN} substitution in provisioning/datasources/influxdb.yaml.
      - INFLUX_TOKEN=${INFLUX_TOKEN}
    volumes:
      - /home/hughboi/data/grafana:/var/lib/grafana
      # Git-tracked dashboard provisioning (file-based). Dashboards live in the
      # repo and are loaded read-only; edits made in the UI to these are not saved
      # back — change the JSON in the repo instead.
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards-provisioned:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.entrypoints=http"
      - "traefik.http.routers.grafana.rule=Host(`grafana.hughboi.cc`)"
      - "traefik.http.middlewares.grafana-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.grafana.middlewares=grafana-https-redirect"
      - "traefik.http.routers.grafana-secure.entrypoints=https"
      - "traefik.http.routers.grafana-secure.rule=Host(`grafana.hughboi.cc`)"
      - "traefik.http.routers.grafana-secure.tls=true"
      - "traefik.http.routers.grafana-secure.service=grafana"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
      - "traefik.docker.network=proxy"
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 128m
    networks:
      - promgraftail
      - proxy

  influxdb:
    container_name: influxdb
    image: influxdb:2.9.1                   # was 2.7  (latest 2.x, verified)
    restart: unless-stopped
    user: "1000"
    security_opt:
      - no-new-privileges:true
      - apparmor:unconfined
    logging:
      driver: loki
      options:
        loki-url: "https://loki.hughboi.cc/loki/api/v1/push"
        loki-retries: 2
        loki-max-backoff: 800ms
        loki-timeout: 1s
        keep-file: "true"
        mode: "non-blocking"
    environment:
      # First-run auto-setup (only acts when the data dir is empty). Creates the
      # org/bucket/admin token telegraf + Grafana authenticate with. Values from
      # .env.sops. Deploy with ./scripts/sops-run.sh promgraftail up -d.
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUX_ADMIN_USER}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUX_ADMIN_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUX_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUX_BUCKET}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_TOKEN}
    volumes:
      # FIX (#61): 2.x stores data at /var/lib/influxdb2, not /var/lib/influxdb.
      # The old wrong path meant 2.x ran on a throwaway anonymous volume (fresh,
      # un-set-up) -> telegraf 401. Bind the correct 2.x path under /data.
      - /home/hughboi/data/influxdb2:/var/lib/influxdb2
    ports:                                  # localhost-bound (Traefik reaches via proxy net) — #50
      - "127.0.0.1:8086:8086"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.influxdb.entrypoints=http"
      - "traefik.http.routers.influxdb.rule=Host(`influxdb.hughboi.cc`)"
      - "traefik.http.middlewares.influxdb-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.influxdb.middlewares=influxdb-https-redirect"
      - "traefik.http.routers.influxdb-secure.entrypoints=https"
      - "traefik.http.routers.influxdb-secure.rule=Host(`influxdb.hughboi.cc`)"
      - "traefik.http.routers.influxdb-secure.tls=true"
      - "traefik.http.routers.influxdb-secure.service=influxdb"
      - "traefik.http.services.influxdb.loadbalancer.server.port=8086"
      - "traefik.docker.network=proxy"
    networks:
      - promgraftail
      - proxy

  loki:
    container_name: loki
    image: grafana/loki:3.7.6               # latest stable; old logs wiped, fresh start
    restart: unless-stopped
    command: "-config.file=/etc/loki/config.yaml"
    security_opt:
      - no-new-privileges:true
      - apparmor:unconfined
    user: "1000:1000"
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - /home/hughboi/data/loki:/loki:rw
    ports:                                  # localhost-bound (#50)
      - "127.0.0.1:3100:3100"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.loki.entrypoints=http"
      - "traefik.http.routers.loki.rule=Host(`loki.hughboi.cc`)"
      - "traefik.http.middlewares.loki-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.loki.middlewares=loki-https-redirect"
      - "traefik.http.routers.loki-secure.entrypoints=https"
      - "traefik.http.routers.loki-secure.rule=Host(`loki.hughboi.cc`)"
      - "traefik.http.routers.loki-secure.tls=true"
      - "traefik.http.routers.loki-secure.service=loki"
      - "traefik.http.services.loki.loadbalancer.server.port=3100"
      - "traefik.docker.network=proxy"
    deploy:
      resources:
        limits:
          # Bumped 512m -> 1500m: Loki 3.7.6 (up from 3.4.2 in the migration) uses
          # more memory, and the whole fleet's loki-driver ingest pushed it into a
          # restart loop (hit 512m -> graceful exit -> restart, ~every minute).
          memory: 1500m
        reservations:
          memory: 128m
    networks:
      - proxy
      - promgraftail

  prometheus:
    container_name: prometheus
    image: prom/prometheus:v3.13.2          # was :latest  (verified latest stable)
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
      - apparmor:unconfined
    # remote-write receiver enabled so a future Alloy can push metrics here.
    command: "--config.file=/etc/prometheus/prometheus.yml --web.enable-remote-write-receiver"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    ports:                                  # localhost-bound (#50)
      - "127.0.0.1:9070:9090"
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 256m
    networks:
      - promgraftail
      # - proxy

  alertmanager:
    container_name: alertmanager
    image: quay.io/prometheus/alertmanager:v0.33.1   # was untagged (verified latest)
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
      - apparmor:unconfined
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    logging:
      driver: loki
      options:
        loki-url: "https://loki.hughboi.cc/loki/api/v1/push"
        loki-retries: 2
        loki-max-backoff: 800ms
        loki-timeout: 1s
        keep-file: "true"
        mode: "non-blocking"
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:                                  # localhost-bound (#50)
      - "127.0.0.1:9093:9093"
    networks:
      - promgraftail
      - proxy

  # Promtail was sunset (2026-08) in favor of Grafana Alloy (below). Its old
  # service definition + config are archived at apps/docker/sunset/promtail/.

  # Grafana Alloy — this stack's log collector, replacing the (EOL) Promtail.
  # Ships: dock-prod /var/log/*, bind9 syslog (:1514), AdGuard query log (JSON).
  # Docker container logs are NOT scraped here — they ship via the loki logging
  # driver already (see config.alloy for the reasoning).
  alloy:
    container_name: alloy
    image: grafana/alloy:v1.18.1
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
      - apparmor:unconfined
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      - /var/log:/var/log:ro
      # Docker socket/containers dir intentionally NOT mounted: container logs
      # ship via the loki logging driver, not Alloy (see config.alloy).
      - /home/hughboi/data/adguard/work/data:/adguard-querylog:ro
    ports:
      - "127.0.0.1:12345:12345"   # Alloy UI (localhost only)
      - "1541:1514/tcp"           # bind9 syslog receiver (was promtail's port)
      - "1541:1514/udp"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.alloy.entrypoints=http"
      - "traefik.http.routers.alloy.rule=Host(`alloy.hughboi.cc`)"
      - "traefik.http.middlewares.alloy-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.alloy.middlewares=alloy-https-redirect"
      - "traefik.http.routers.alloy-secure.entrypoints=https"
      - "traefik.http.routers.alloy-secure.rule=Host(`alloy.hughboi.cc`)"
      - "traefik.http.routers.alloy-secure.tls=true"
      - "traefik.http.routers.alloy-secure.service=alloy"
      - "traefik.http.services.alloy.loadbalancer.server.port=12345"
      - "traefik.docker.network=proxy"
    networks:
      - promgraftail
      - proxy

  telegraf:
    container_name: telegraf
    image: telegraf:1.39.3                  # was 1.32.3  (verified latest stable)
    restart: unless-stopped
    user: telegraf:988
    security_opt:
      - no-new-privileges:true
      - apparmor:unconfined
    logging:
      driver: loki
      options:
        loki-url: "https://loki.hughboi.cc/loki/api/v1/push"
        loki-retries: 2
        loki-max-backoff: 800ms
        loki-timeout: 1s
        keep-file: "true"
        mode: "non-blocking"
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - /:/hostfs:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./mibs:/usr/share/snmp/mibs
    environment:
      - HOST_ETC=/hostfs/etc
      - HOST_PROC=/hostfs/proc
      - HOST_SYS=/hostfs/sys
      - HOST_VAR=/hostfs/var
      - HOST_RUN=/hostfs/run
      - HOST_MOUNT_PREFIX=/hostfs
      # telegraf.conf uses token = "${INFLUX_TOKEN}" for influxdb_v2 output.
      - INFLUX_TOKEN=${INFLUX_TOKEN}
    networks:
      - promgraftail

  # Intel Arc A380 GPU exporter — home-built (see ./intel-gpu-exporter). Lives in
  # this stack (no single app owns the GPU; it's shared by jellyfin + immich ML).
  # Needs broad access to read GPU perf counters: privileged + /dev/dri + host PID.
  intel-gpu-exporter:
    container_name: intel-gpu-exporter
    build:
      context: ./intel-gpu-exporter
      dockerfile: Dockerfile
    image: homelab/intel-gpu-exporter:local
    restart: unless-stopped
    privileged: true
    pid: host
    devices:
      - /dev/dri:/dev/dri
    networks:
      - promgraftail


volumes:
  alloy_data:

networks:
  promgraftail:
    name: promgraftail
  proxy:
    external: true
