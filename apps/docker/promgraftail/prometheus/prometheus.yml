# my global config
### GLOBAL PARAMETERS
global:
  scrape_interval: 60s
  evaluation_interval: 60s
  body_size_limit: 100MB
  sample_limit: 2000
  target_limit: 75
  label_limit: 75
  label_name_length_limit: 300
  label_value_length_limit: 300


### ALERTS via Prometheus Alert manager
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
rule_files:
 - /etc/prometheus/alert-rules.yml


### TARGETS TO SCRAPE
scrape_configs:

  - job_name: 'crowdsec'
    static_configs:
      - targets: ['10.10.10.10:6060']


  # Immich "eros" instance — telemetry enabled (IMMICH_TELEMETRY_INCLUDE=all),
  # API metrics on host :8091 -> container :8081. Immich emits >2000 series, so
  # raise sample_limit above the global 2000 or the whole scrape is rejected
  # ("sample limit exceeded" — the real reason this was previously "down", not
  # unreachability).
  - job_name: immich_api
    scrape_interval: 30s
    sample_limit: 15000
    static_configs:
      - targets: ['10.10.10.10:8091']
        labels:
          instance: eros


  - job_name: 'unifipoller'
    scrape_interval: 30s
    static_configs:
    - targets: ['10.10.10.10:9130']


  # unbound_exporter sidecar in the adguard stack — reached container-to-container
  # over the shared promgraftail network (no host port published).
  - job_name: unbound
    static_configs:
      - targets: ['unbound-exporter:9167']

  # Host metrics from the prometheus-node-exporter systemd service on dock-prod.
  # node_exporter emits ~6000+ series, well over the global sample_limit: 2000,
  # so raise it for this job only.
  - job_name: node
    scrape_interval: 30s
    sample_limit: 10000
    static_configs:
      - targets: ['10.10.10.10:9100']
        labels:
          instance: dock-prod

  # Intel Arc A380 GPU — home-built exporter (apps/docker/intel-gpu-exporter),
  # reached container-to-container over the shared promgraftail network.
  - job_name: intel_gpu
    scrape_interval: 15s
    static_configs:
      - targets: ['intel-gpu-exporter:8080']

  # Jellyfin playback/transcode stats — home-built exporter
  # (apps/docker/jellyfin-exporter). Needs its JELLYFIN_API_KEY set (SOPS) and the
  # container running; until then this target will be down.
  - job_name: jellyfin
    scrape_interval: 15s
    static_configs:
      - targets: ['jellyfin-exporter:8080']
    