---
apiVersion: 1

# InfluxDB 2.x (Flux) datasource, provisioned as code so its token stays in sync
# with the InfluxDB admin token (INFLUX_TOKEN, from .env.sops). Reuses the existing
# UID so dashboards that reference it keep resolving.
datasources:
  - name: influxdb
    uid: de6qyj7jvk4qof
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    orgId: 1
    isDefault: false
    editable: false
    jsonData:
      version: Flux
      organization: homelab
      defaultBucket: telegraf
      tlsSkipVerify: true
    secureJsonData:
      token: ${INFLUX_TOKEN}
