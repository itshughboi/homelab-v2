---
# CrowdSec + Traefik bouncer. ⚠️ The bouncer's forwardAuth (applied globally in
# traefik's config.yml) fails CLOSED — if the bouncer can't reach/authenticate to
# crowdsec, every request through Traefik 403s homelab-wide (incl. Gitea/Semaphore).
# Never leave Traefik routing without a running, authenticated bouncer.
#
# Data lives under /home/hughboi/data/crowdsec (config + db bind mounts — NOT empty
# named volumes, which would wipe the ban DB + the registered bouncer key). The
# bouncer key is the real, DB-registered key, injected from .env.sops.
services:
  crowdsec:
    container_name: crowdsec
    image: crowdsecurity/crowdsec:v1.7.4   # pinned to the running version (no DB migration on cutover)
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: loki
      options:
        loki-url: "https://loki.hughboi.cc/loki/api/v1/push"
        loki-retries: 2
        loki-max-backoff: 800ms
        loki-timeout: 1s
        keep-file: "true"
        mode: "non-blocking"
    environment:
      - GID=${GID:-1000}
      - COLLECTIONS=crowdsecurity/linux crowdsecurity/traefik
    volumes:
      - ./acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - /home/hughboi/data/crowdsec/config:/etc/crowdsec/
      - /home/hughboi/data/crowdsec/db:/var/lib/crowdsec/data/
      # Reads Traefik's access logs for acquisition (see acquis.yaml). Path must
      # match where the traefik service writes its logs (/home/hughboi/data/traefik/logs).
      - /home/hughboi/data/traefik/logs:/var/log/traefik/:ro
    ports:
      - "6060:6060"       # Prometheus metrics (scraped by the `crowdsec` job)
      - "8099:8080"       # LAPI (kept as live; bouncer uses the docker network)
    labels:
      - "diun.enable=true"
    networks:
      - proxy

  bouncer-traefik:
    container_name: bouncer-traefik
    image: docker.io/fbonalair/traefik-crowdsec-bouncer:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      crowdsec:
        condition: service_started
    environment:
      # Real, DB-registered key from .env.sops (reusing it = zero bouncer re-registration).
      - CROWDSEC_BOUNCER_API_KEY=${CROWDSEC_BOUNCER_API_KEY}
      - CROWDSEC_AGENT_HOST=crowdsec:8080
    labels:
      - "diun.enable=true"
    networks:
      - proxy

networks:
  proxy:
    external: true
