---
services:
  glances:
    container_name: glances
    image: nicolargo/glances:4.5.6
    restart: unless-stopped
    # pid:host and privileged are required for full host metrics visibility
    pid: "host"
    privileged: true
    environment:
      - TZ=America/Denver
      - GLANCES_OPT=-C /glances/conf/glances.conf -w
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./glances.conf:/glances/conf/glances.conf
    ports:
      # bound to all interfaces so the homepage container can reach it at the host LAN IP (10.10.10.10)
      - "61208:61208"
