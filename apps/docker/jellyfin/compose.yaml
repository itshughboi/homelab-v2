---
services:
  jellyfin:
    container_name: jellyfin
    image: jellyfin/jellyfin:10.11.8
    restart: unless-stopped
    user: "1000:1000"
    # GPU access for hardware transcoding (Intel Arc A380). The container user
    # must be in the render + video groups to use /dev/dri.
    group_add:
      - "993"   # render  (stat -c '%g' /dev/dri/renderD128)
      - "44"    # video
    devices:
      - /dev/dri/card0:/dev/dri/card0
      - /dev/dri/card1:/dev/dri/card1
      - /dev/dri/renderD128:/dev/dri/renderD128
    security_opt:
      - no-new-privileges:true
      - apparmor:unconfined
    logging:
      driver: loki
      options:
        loki-url: "https://loki.hughboi.cc/loki/api/v1/push"
        loki-retries: 2
        loki-max-backoff: 800ms
        loki-timeout: 1s
        keep-file: "true"
        mode: "non-blocking"
    environment:
      - TZ=America/Denver
    volumes:
      # Runtime data under /home/hughboi/data (matches the live deployment).
      - /home/hughboi/data/jellyfin/config:/config
      - /home/hughboi/data/jellyfin/cache:/cache
      # Media libraries from TrueNAS (read-only).
      - /mnt/truenas/jellyfin/Films:/Films:ro
      - /mnt/truenas/jellyfin/TVShows:/TVShows:ro
      - /mnt/truenas/jellyfin/Music:/Music:ro
      - /mnt/truenas/jellyfin/Concerts:/Concerts:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin.entrypoints=http"
      - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.hughboi.cc`)"
      - "traefik.http.middlewares.jellyfin-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.jellyfin.middlewares=jellyfin-https-redirect"
      - "traefik.http.routers.jellyfin-secure.entrypoints=https"
      - "traefik.http.routers.jellyfin-secure.rule=Host(`jellyfin.hughboi.cc`)"
      - "traefik.http.routers.jellyfin-secure.tls=true"
      - "traefik.http.routers.jellyfin-secure.service=jellyfin"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
      - "traefik.docker.network=proxy"
    networks:
      - proxy

  # Home-built Jellyfin Prometheus exporter, co-located with the app it monitors.
  # Polls Jellyfin's API (playback/transcode/library) and exposes :8080 for the
  # `jellyfin` Prometheus job. Reaches jellyfin over `proxy`; scraped over
  # `promgraftail`. Needs JELLYFIN_API_KEY from .env.sops — deploy this stack with
  # ./scripts/sops-run.sh jellyfin up -d --build (not plain docker compose).
  jellyfin-exporter:
    container_name: jellyfin-exporter
    build:
      context: ./jellyfin-exporter
      dockerfile: Dockerfile
    image: homelab/jellyfin-exporter:local
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - JELLYFIN_URL=http://jellyfin:8096
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY}
      - POLL_SECONDS=15
    depends_on:
      - jellyfin
    networks:
      - proxy
      - promgraftail

networks:
  proxy:
    external: true
  promgraftail:
    external: true
