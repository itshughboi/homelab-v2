---
services:
  portainer:
    container_name: portainer
    image: docker.io/portainer/portainer-ce:2.41.1
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: loki
      options:
        loki-url: "https://loki.hughboi.cc/loki/api/v1/push"
        loki-retries: 2
        loki-max-backoff: 800ms
        loki-timeout: 1s
        keep-file: "true"
        mode: "non-blocking"
    volumes:
      - /run/docker.sock:/var/run/docker.sock
      # Data migrated from the old portainer_portainer-data named volume to a bind
      # mount under /data (matches the homelab convention; part of #55).
      - /home/hughboi/data/portainer:/data
    ports:
      - "9445:9000"   # direct UI access (kept from live), Traefik also fronts it
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.entrypoints=http"
      - "traefik.http.routers.portainer.rule=Host(`portainer.hughboi.cc`)"
      - "traefik.http.middlewares.portainer-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.portainer.middlewares=portainer-https-redirect"
      - "traefik.http.routers.portainer-secure.entrypoints=https"
      - "traefik.http.routers.portainer-secure.rule=Host(`portainer.hughboi.cc`)"
      - "traefik.http.routers.portainer-secure.tls=true"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"
    networks:
      - proxy


networks:
  proxy:
    external: true
