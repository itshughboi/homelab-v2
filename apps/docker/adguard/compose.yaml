---
services:
  adguardhome:
    container_name: adguard
    image: adguard/adguardhome:v0.107.71
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: loki
      options:
        loki-url: "https://loki.hughboi.cc/loki/api/v1/push"
        loki-retries: 2
        loki-max-backoff: 800ms
        loki-timeout: 1s
        keep-file: "true"
        mode: "non-blocking"
    environment:
      - TZ=America/Denver
      - ADGUARD_DNS_=192.168.100.10#5335   # IP of unbound on the unbound network
    volumes:
      # App data lives outside the git repo, under /home/hughboi/data
      - /home/hughboi/data/adguard/conf:/opt/adguardhome/conf
      - /home/hughboi/data/adguard/work:/opt/adguardhome/work
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      # - "853:853/tcp"    # DNS over TLS
      # - "784:784/udp"    # Unbound remote control
      # - "3000:3000/tcp"  # Setup UI — only needed for first spin-up
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.adguard.entrypoints=http"
      - "traefik.http.routers.adguard.rule=Host(`adguard.hughboi.cc`)"
      - "traefik.http.middlewares.adguard-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.adguard.middlewares=adguard-https-redirect"
      - "traefik.http.routers.adguard-secure.entrypoints=https"
      - "traefik.http.routers.adguard-secure.rule=Host(`adguard.hughboi.cc`)"
      - "traefik.http.routers.adguard-secure.tls=true"
      - "traefik.http.routers.adguard-secure.service=adguard"
      - "traefik.http.services.adguard.loadbalancer.server.port=80"
      - "traefik.docker.network=proxy"
    networks:
      unbound:
        ipv4_address: 192.168.100.9
      proxy:

  unbound:
    container_name: unbound
    image: mvance/unbound:1.22.0
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # The mvance/unbound image ships `drill` (ldns), not `dig`, and unbound
      # listens on port 5335 here (see `interface: 0.0.0.0@5335` in unbound.conf) —
      # not 53. The old `dig ... -p 53` check could never pass, so the container
      # sat "unhealthy" forever despite resolving fine. Alerting on DNS failures
      # is handled externally by Gatus (dns:// checks); this check is just the
      # local Docker/Portainer health signal.
      test: ["CMD", "drill", "@127.0.0.1", "-p", "5335", "cloudflare.com"]
      interval: 600s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      # Config files are git-tracked and mounted read-only from this repo.
      - ./unbound/unbound.conf:/opt/unbound/etc/unbound/unbound.conf:ro
      - ./unbound/forward-records.conf:/opt/unbound/etc/unbound/forward-records.conf:ro
      - ./unbound/root.hints:/opt/unbound/etc/unbound/root.hints:ro
      # Writable runtime state (auto-trust-anchor var/root.key) lives under /data.
      - /home/hughboi/data/adguard/unbound/var:/opt/unbound/etc/unbound/var
    ports:
      # unbound listens on container port 5335 (interface: 0.0.0.0@5335), so the
      # host mapping must target 5335, not 53. The old "5335:53" mapped to a dead
      # container port — harmless only because AdGuard reaches unbound over the
      # docker network (192.168.100.10#5335), never via the host port.
      - "5335:5335/tcp"
      - "5335:5335/udp"
    networks:
      unbound:
        ipv4_address: 192.168.100.10

  # Prometheus exporter for unbound stats (cache hit ratio, QPS, latency, etc.).
  # Talks to unbound over the unix control socket at var/unbound.ctl (shared via
  # the same /home/hughboi/data/adguard/unbound/var bind mount). Scraped by
  # Prometheus in the promgraftail stack (job: unbound).
  unbound-exporter:
    container_name: unbound-exporter
    image: sapcc/unbound_exporter:20250827111359
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - unbound
    command:
      - "-unbound.host=unix:///unbound-ctl/unbound.ctl"
      - "-unbound.ca="
      - "-unbound.cert="
      - "-unbound.key="
    volumes:
      # Read the control socket unbound creates under var/.
      - /home/hughboi/data/adguard/unbound/var:/unbound-ctl:ro
    networks:
      - unbound
      - promgraftail


networks:
  unbound:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.100.0/27
  proxy:
    external: true
  # Shared with the promgraftail stack so Prometheus can scrape the exporter
  # container-to-container (no host port needed).
  promgraftail:
    external: true
